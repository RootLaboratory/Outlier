[/Script/GameplayTags.GameplayTagsList]
; GameplayCue 태그. Notify 에셋은 /Game/GameplayCues 아래에 두어야 스캔된다
; ( DefaultGame.ini 의 [/Script/GameplayAbilities.AbilitySystemGlobals] GameplayCueNotifyPaths ).
;
; 매칭은 계층적이다 — 자식 태그에 전용 Notify 가 없으면 부모 Notify 가 대신 처리된다.
; 즉 GameplayCue.Drone.Death.Gun 용 에셋을 안 만들면 GameplayCue.Drone.Death 가 받는다.
; 따라서 연출이 실제로 갈라질 때만 자식 에셋을 추가하면 된다.
GameplayTagList=(Tag="GameplayCue",DevComment="Root tag for gameplay cues")

GameplayTagList=(Tag="GameplayCue.Drone",DevComment="Enemy drone cue category")
GameplayTagList=(Tag="GameplayCue.Drone.Hit",DevComment="Drone took damage. Burst. Fired per damage application")
GameplayTagList=(Tag="GameplayCue.Drone.Death",DevComment="Drone died. Burst. Fired once from AEnemyBase::Die")

; 아래 둘은 총드론/자폭드론 사망 연출이 갈릴 때만 전용 에셋을 만든다.
; 에셋이 없으면 위의 GameplayCue.Drone.Death 로 자동 폴백된다.
GameplayTagList=(Tag="GameplayCue.Drone.Death.Gun",DevComment="AVECDrone death. Falls back to GameplayCue.Drone.Death when no notify exists")
GameplayTagList=(Tag="GameplayCue.Drone.Death.Melee",DevComment="ASelfDestructDrone death. Falls back to GameplayCue.Drone.Death when no notify exists")
